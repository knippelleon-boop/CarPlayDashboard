workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 30
    environment:
      node: 22.14.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild --platform ios --no-install
      - name: Configure Xcode Node Environment
        script: echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
      - name: CocoaPods
        script: cd ios && pod install
      - name: Build Device App
        script: xcodebuild -workspace ios/CarDashboard.xcworkspace -scheme CarDashboard -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        script: mkdir -p Payload && cp -r build/Build/Products/Release-iphoneos/CarDashboard.app Payload/ && zip -r CarDashboard.ipa Payload
    artifacts:
      - CarDashboard.ipa
